server:
  port: ${SERVER_PORT:9090}
spring:
  application:
    name: core-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartops_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    defer-datasource-initialization: true
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      encoding: UTF-8
 # Luôn chạy script khởi tạo
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}

admin:
  email: ${ADMIN_EMAIL:admin@example.com}

upload:
  path: uploads/ekyc
ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8080}
  extract-endpoint: /internal/ai/embed
  compare-endpoint: /internal/ai/compare

app:
  kiosk:
    key: ${KIOSK_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  demo-data-enabled: ${DEMO_DATA_ENABLED:false}
  demo-password: ${DEMO_PASSWORD:}
