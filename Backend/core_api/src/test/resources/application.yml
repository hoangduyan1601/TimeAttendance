spring:
  datasource:
    url: jdbc:h2:mem:smartops_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: false
    show-sql: false
  sql:
    init:
      mode: never
  mail:
    host: localhost
    port: 2525
    username: test@example.com
    password: test
jwt:
  secret: test-only-secret-key-that-is-at-least-32-characters-long
  expiration: 3600000
app:
  kiosk:
    key: test-kiosk-key
  cors:
    allowed-origins: http://localhost:3000
  demo-data-enabled: false
  demo-password: test-demo-password
ai-service:
  url: http://localhost:8080
  extract-endpoint: /internal/ai/embed
  compare-endpoint: /internal/ai/compare
upload:
  path: target/test-uploads
admin:
  email: admin@example.com
