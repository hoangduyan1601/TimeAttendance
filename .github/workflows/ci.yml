name: CI

on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/core_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Spring tests
        run: ./mvnw test

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/smartops_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Analyze (errors are fatal; existing style infos are reported)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
